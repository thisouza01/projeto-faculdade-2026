# ===================================
# CONFIGURAÇAO DA APLICAÇAO
# ===================================
spring.application.name=importador-extrato

# ===================================
# BANCO DE DADOS H2
# ===================================
spring.datasource.url=jdbc:h2:mem:importadordb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console Web do H2 (para visualizar o banco)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===================================
# JPA / HIBERNATE
# ===================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===================================
# SPRING BATCH
# ===================================
# Inicializa o schema do Spring Batch automaticamente
spring.batch.jdbc.initialize-schema=always

# Desabilita execução automática de jobs ao iniciar (habilitar depois)
spring.batch.job.enabled=false

# ===================================
# UPLOAD DE ARQUIVOS
# ===================================
# Tamanho máximo do arquivo (10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Diretório de uploads (criar depois)
app.upload.dir=uploads