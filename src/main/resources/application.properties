# ===================================
# CONFIGURAÇAO DA APLICAÇAO
# ===================================
spring.application.name=importador-extrato

# ===================================
# BANCO DE DADOS POSTGRESQL
# ===================================
spring.datasource.url=jdbc:postgresql://localhost:5432/importadordb
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=senha123

# ===================================
# JPA / HIBERNATE
# ===================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===================================
# SPRING BATCH
# ===================================
# Inicializa o schema do Spring Batch automaticamente
spring.batch.jdbc.initialize-schema=always

# Desabilita execução automática de jobs ao iniciar - False
spring.batch.job.enabled=True

# ===================================
# UPLOAD DE ARQUIVOS
# ===================================
# Tamanho máximo do arquivo (10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Diretório de uploads (criar depois)
app.upload.dir=uploads